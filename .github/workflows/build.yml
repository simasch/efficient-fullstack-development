name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install Playwright dependencies
      run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps" -D exec.classpathScope=test

    - name: Build with Maven
      run: mvn -B verify

    # Handed to the deploy job, which ships exactly the jar that was
    # verified here - it is never rebuilt
    - name: Upload the jar
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7
      with:
        name: application-jar
        path: target/task-management-*.jar
        retention-days: 1

  deploy:
    name: Deploy to Fly.io
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never two deploys at once: a single machine is replaced in place
    concurrency: fly-deploy
    steps:
    - uses: actions/checkout@v7

    - name: Download the verified jar
      uses: actions/download-artifact@v8
      with:
        name: application-jar
        path: target

    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: flyctl deploy --remote-only
