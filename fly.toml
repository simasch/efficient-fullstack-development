app = "efficient-task-management"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  # Vaadin holds UI state in the HTTP session; exactly one machine, never
  # stopped - scaling out would need session affinity, scaling to zero
  # would drop every active session. First deploy must use `fly deploy --ha=false`.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    type = "http"
    port = 9091
    path = "/actuator/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[metrics]
  port = 9091
  path = "/actuator/prometheus"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
