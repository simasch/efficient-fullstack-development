# The secret must come from the environment - boot fails fast if it is missing,
# instead of falling back to the development value printed in a book
jwt.auth.secret=${JWT_AUTH_SECRET}

# Development logs every statement with its bind values; production must not
# (performance, and personal data in logs - Chapter 8)
logging.level.org.jooq.tools.LoggerListener=INFO

# Fly's proxy terminates TLS; trust its X-Forwarded-* headers so Spring Security
# marks cookies Secure, sends HSTS, and builds https redirect URIs
server.forward-headers-strategy=framework

# The servlet session cookie (the JWT cookies are handled by the framework)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Return session memory sooner: closed tabs expire after 3 missed heartbeats,
# and the session ends 30 minutes after the last real user activity
vaadin.heartbeatInterval=120
vaadin.closeIdleSessions=true
server.servlet.session.timeout=30m

# Pool sizing and fail-fast behaviour from Chapter 8
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.leak-detection-threshold=10000

# Actuator on a separate port that the platform does not expose publicly
management.server.port=9091
management.endpoints.web.exposure.include=health,prometheus
